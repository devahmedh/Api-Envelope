name: release

# Branch-driven versioning. The base version lives in Directory.Build.props as
# VersionPrefix; the channel suffix is derived from the branch being pushed:
#
#   development  ->  <prefix>-alpha.<run>    prerelease, npm dist-tag "alpha"
#   testing      ->  <prefix>-beta.<run>     prerelease, npm dist-tag "beta"
#   production   ->  <prefix>                release,    npm dist-tag "latest"
#
# development does not publish automatically — it packs and uploads the alpha as a
# workflow artifact. Versions on nuget.org can never be deleted, only unlisted, so a
# push-per-commit policy would permanently accumulate. Use the manual run below to
# publish an alpha deliberately.

on:
  push:
    branches: [testing, production]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to nuget.org and npm (otherwise pack and upload only)'
        type: boolean
        default: false

permissions:
  contents: write
  # Required for npm trusted publishing. The job exchanges a short-lived GitHub OIDC
  # token for publish rights on the package, so no npm credential is stored anywhere.
  # The same token is what lets npm attach a signed provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # No registry-url on purpose. That input makes setup-node write an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}`; with trusted publishing there is no
      # such variable to expand, and npm treats an unresolvable env reference in .npmrc
      # as a hard error. The registry is instead declared in the package's own
      # publishConfig, which is where it belongs and cannot drift from the workflow.
      #
      # Node 24 because trusted publishing requires Node >= 22.14.0; Node 20 is also
      # past end of support on GitHub runners.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Trusted publishing needs npm >= 11.5.1. An older npm does not fail loudly — it
      # simply does not attempt the OIDC exchange, and falls back to looking for a
      # credential it will not find. Assert the version rather than trusting whatever
      # npm the Node image happened to bundle.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install -g npm@latest

          required=11.5.1
          have=$(npm --version)
          echo "npm $have (require >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
            echo "::error::npm $have is too old for trusted publishing; need >= $required"
            exit 1
          fi

      - name: Resolve the version and channel for this branch
        id: version
        run: |
          prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)

          case "$GITHUB_REF_NAME" in
            production) suffix=""                              ; npm_tag="latest" ;;
            testing)    suffix="beta.${GITHUB_RUN_NUMBER}"     ; npm_tag="beta"   ;;
            *)          suffix="alpha.${GITHUB_RUN_NUMBER}"    ; npm_tag="alpha"  ;;
          esac

          if [ -n "$suffix" ]; then version="$prefix-$suffix"; else version="$prefix"; fi

          # Only production publishes on push. Any other branch requires an explicit
          # manual run with publish=true.
          if [ "$GITHUB_REF_NAME" = "production" ] || [ "$GITHUB_REF_NAME" = "testing" ]; then
            publish="true"
          else
            publish="${{ inputs.publish }}"
          fi

          echo "branch=$GITHUB_REF_NAME"
          echo "version=$version"
          echo "npm_tag=$npm_tag"
          echo "publish=$publish"

          {
            echo "prefix=$prefix"
            echo "suffix=$suffix"
            echo "version=$version"
            echo "npm_tag=$npm_tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the npm package version matches the base version
        run: |
          npm_version=$(node -p "require('./npm/thespectre-apienvelope-types/package.json').version")
          if [ "$npm_version" != "${{ steps.version.outputs.prefix }}" ]; then
            echo "::error::npm package.json is $npm_version but Directory.Build.props is ${{ steps.version.outputs.prefix }}. All artifacts version in lockstep."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Run the full test suite
        run: dotnet test --no-build -c Release -p:VersionSuffix=${{ steps.version.outputs.suffix }} --verbosity normal

      - name: Pack all five packages
        run: |
          rm -rf artifacts
          for p in TheSpectre.ApiEnvelope TheSpectre.ApiEnvelope.AspNetCore \
                   TheSpectre.ApiEnvelope.FluentValidation TheSpectre.ApiEnvelope.DataAnnotations \
                   TheSpectre.ApiEnvelope.EntityFrameworkCore; do
            dotnet pack "src/$p/$p.csproj" -c Release \
              -p:VersionSuffix=${{ steps.version.outputs.suffix }} \
              -o artifacts/local-feed
          done
          ls -la artifacts/local-feed

      - name: Assert every package carries both target frameworks and a README
        run: |
          count=0
          for pkg in artifacts/local-feed/*.nupkg; do
            echo "--- $pkg"
            # unzip -Z1 prints bare entry names, one per line. Parsing `unzip -l` columns
            # instead is how an anchored pattern silently never matches.
            entries=$(unzip -Z1 "$pkg")
            echo "$entries" | grep -qE '^lib/net8\.0/.*\.dll$'  || { echo "::error::$pkg missing lib/net8.0";  exit 1; }
            echo "$entries" | grep -qE '^lib/net10\.0/.*\.dll$' || { echo "::error::$pkg missing lib/net10.0"; exit 1; }
            echo "$entries" | grep -qx 'README.md'                || { echo "::error::$pkg missing README.md";   exit 1; }
            echo "$entries" | grep -E '^(lib/|README)'
            count=$((count + 1))
          done
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 packages, packed $count"
            exit 1
          fi

      - name: Assert the packed version matches the resolved version
        run: |
          expected="${{ steps.version.outputs.version }}"
          if ! ls "artifacts/local-feed/TheSpectre.ApiEnvelope.${expected}.nupkg" >/dev/null 2>&1; then
            echo "::error::expected TheSpectre.ApiEnvelope.${expected}.nupkg; found:"
            ls artifacts/local-feed
            exit 1
          fi

      - name: Upload the packages as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/local-feed/*

      # npm is published FIRST, deliberately. The two registries differ in how
      # recoverable a mistake is: an npm version can be unpublished within 72 hours of
      # release, whereas a version on nuget.org can never be deleted, only unlisted. The
      # cheapest failure is therefore the one that happens while nuget.org is still
      # untouched, which means the less permanent registry goes first.
      #
      # A read-only preflight is not a substitute for this ordering. `npm whoami`
      # authenticates a token but never exercises the publish authorisation path, so a
      # token that is valid yet lacks the 2FA-bypass property passes `whoami` and then
      # fails at PUT — by which point nuget.org has already accepted the version
      # permanently. Ordering is enforcement; a probe is only a hint.
      # Authentication is the job's OIDC identity, not a stored secret. npm verifies the
      # token against the trusted publisher configured on the package — which pins this
      # repository, this workflow filename and this environment — so a workflow added on
      # a fork or under a different filename cannot publish, and there is no credential
      # to leak or rotate.
      #
      # --provenance is explicit rather than relying on the documented default: a
      # silently absent attestation is indistinguishable from a present one at the call
      # site, and the flag makes a missing OIDC token fail the publish instead of
      # quietly downgrading it.
      - name: Publish the npm types package
        if: steps.version.outputs.publish == 'true'
        working-directory: npm/thespectre-apienvelope-types
        run: |
          npm ci
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          # --tag matters: without it npm points "latest" at whatever was published last,
          # so a prerelease would become the default install for everyone.
          npm publish --provenance --tag "${{ steps.version.outputs.npm_tag }}"

      - name: Push packages to nuget.org
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # Symbols ride along: pushing foo.nupkg also pushes the foo.snupkg sitting beside it,
          # which is why there is no second command for them. There used to be one, and it
          # reported "already exists" for every symbol package in every release log.
          dotnet nuget push "artifacts/local-feed/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag the release commit
        if: github.ref_name == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create the GitHub Release
        if: github.ref_name == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"

          awk -v ver="## [$version]" '
            $0 == ver { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$version]."
            exit 1
          fi

          gh release create "v$version" \
            --title "v$version" \
            --notes-file release-notes.md
