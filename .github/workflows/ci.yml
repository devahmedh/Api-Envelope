name: ci

on:
  pull_request:
  push:
    branches: [development, testing, production]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/thespectre-apienvelope-types
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify version lockstep with the NuGet packages
        working-directory: .
        run: |
          # Compare the base versions. Prerelease suffixes are applied by the release
          # pipeline at pack time, so the committed values must match exactly.
          nuget_version=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          npm_version=$(node -p "require('./npm/thespectre-apienvelope-types/package.json').version")
          echo "NuGet: $nuget_version  npm: $npm_version"
          if [ "$nuget_version" != "$npm_version" ]; then
            echo "::error::Version mismatch — all six artifacts must version in lockstep."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Verify types against the golden files
        run: npm test

      - name: Fail if generated fixtures are stale
        run: git diff --exit-code -- test/fixtures.generated.ts

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack both shipped packages
        run: |
          dotnet pack src/TheSpectre.ApiEnvelope/TheSpectre.ApiEnvelope.csproj -c Release -o artifacts/local-feed
          dotnet pack src/TheSpectre.ApiEnvelope.AspNetCore/TheSpectre.ApiEnvelope.AspNetCore.csproj -c Release -o artifacts/local-feed

      - name: Fail if a target framework is missing from a package
        run: |
          # Globbed, not hardcoded: the filename carries the version, which gains a
          # prerelease suffix on development and testing.
          for pkg in artifacts/local-feed/*.nupkg; do
            echo "--- $pkg"
            entries=$(unzip -Z1 "$pkg")
            echo "$entries" | grep -qE '^lib/net8\.0/.*\.dll$' || {
              echo "::error::$pkg is missing lib/net8.0"; exit 1; }
            echo "$entries" | grep -qE '^lib/net10\.0/.*\.dll$' || {
              echo "::error::$pkg is missing lib/net10.0"; exit 1; }
            echo "$entries" | grep -qx 'README.md' || {
              echo "::error::$pkg is missing README.md"; exit 1; }
          done

      - name: Consume the packages from the local feed
        run: dotnet test samples/ConsumerSmoke -c Release

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish samples/AotSmoke -c Release -r linux-x64 -p:PublishAot=true -o aot-out

      - name: Run the native binary and assert the envelope
        run: |
          ./aot-out/AotSmoke --urls http://127.0.0.1:5099 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5099/project >/dev/null && break
            sleep 1
          done

          BODY=$(curl -s http://127.0.0.1:5099/project)
          echo "success body: $BODY"
          echo "$BODY" | grep -q '"isSuccess":true' \
            || { echo "::error::no success envelope under AOT"; exit 1; }
          echo "$BODY" | grep -q '"result":{"id":42,"name":"Ahmed"}' \
            || { echo "::error::payload contract did not resolve under AOT"; exit 1; }

          ERR=$(curl -s http://127.0.0.1:5099/conflict)
          echo "error body: $ERR"
          echo "$ERR" | grep -q '"errorCode":"PROJECT_CODE_TAKEN"' \
            || { echo "::error::no error envelope under AOT"; exit 1; }
          echo "$ERR" | grep -q '"isSuccess":false' \
            || { echo "::error::error envelope reports success under AOT"; exit 1; }
