name: ci

on:
  pull_request:
  push:
    branches: [development, testing]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/thespectre-apienvelope-types
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Verify types against the golden files
        run: npm test

      - name: Fail if generated fixtures are stale
        run: git diff --exit-code -- test/fixtures.generated.ts
